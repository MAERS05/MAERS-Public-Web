<!DOCTYPE html>
<html lang="zh-CN" class="fixed-layout-page">

<head>
    <script src="custom/config.js"></script>
    <script src="shared/flash-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, minimum-scale=0.1, maximum-scale=5.0, user-scalable=yes">
    <title>音乐 · 我的空间</title>

    <!--  Resource Preloading -->
    <link rel="preload" href="static-style/theme.css" as="style">
    <link rel="preload" href="static-style/components.css" as="style">

    <!-- 引入样式 -->
    <link rel="stylesheet" href="static-style/theme.css">
    <link rel="stylesheet" href="static-style/components.css">
    <link rel="stylesheet" href="static-style/style.css">
    <link rel="stylesheet" href="custom/music/viewer/music.css">

    <!-- 数据现在通过 ES6 模块异步加载 (data/music-data.json) -->
</head>

<body>
    <div class="container">
        <div class="main-card">
            <!-- 头部 -->
            <div class="music-header-bar">
                <a href="index.html" class="back-btn" title="返回" aria-label="返回"><svg class="app-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></a>
                <h1 class="center-title"><svg class="app-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13M9 8l11-2"/><ellipse cx="6" cy="18" rx="3" ry="3"/><ellipse cx="17" cy="16" rx="3" ry="3"/></svg><a class="music-mode-btn active" href="music.html" aria-current="page">音乐</a><span class="music-section-divider" aria-hidden="true"></span><a class="music-mode-btn" href="videos.html">影视</a></h1>
                <div class="search-box-wrapper">
                        <input type="text" id="search-input" placeholder="搜索音乐" aria-label="搜索音乐">
                        <div class="search-results" id="search-results"></div>
                    </div>
                <div class="right-icon"></div>
            </div>
            <!-- 主内容区 -->
            <div class="content-wrapper">
                <!-- 左侧：播放器区域 -->
                <div class="monitor-section">
                    <div class="bili-monitor">
                        <!-- 跳转按钮 -->
                        <a aria-label="前往哔哩哔哩观看" id="jump-link" class="jump-link" target="_blank" title="跳转到 哔哩哔哩 观看">
                            <div class="jump-icon"><svg class="app-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 15 6-6M8 17l-2 2a4 4 0 0 1-5-5l5-5a4 4 0 0 1 5 0m2-2 2-2a4 4 0 0 1 5 5l-5 5a4 4 0 0 1-5 0"/></svg></div>
                        </a>
                        <!-- 还原按钮（仅暂停时显示） -->
                        <button aria-label="清除播放记忆" id="reset-link" class="reset-link" title="清除播放记忆">
                            <div class="reset-icon"><svg class="app-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 8a8 8 0 1 0 0 8M20 3v5h-5"/></svg></div>
                        </button>
                        <img id="video-cover" class="video-cover" src="ui/music.webp" width="1296" height="816" fetchpriority="high" alt="">
                        <div id="video-shield"></div>
                        <!-- iframe 由 music-player.js 动态生成 -->
                        <div id="next-tip" class="next-tip">
                        </div>
                        <!-- 画中画按钮 -->
                        <button class="pip-float-btn" title="画中画模式" aria-label="画中画">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="3" />
                            </svg>
                        </button>
                    </div>
                    <!-- 播放控制条 -->
                    <div class="custom-control-bar">
                        <div class="control-btns">
                            <button class="ctrl-btn" id="play-prev-btn" title="上一首" aria-label="上一首"><svg class="app-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button>
                            <button class="ctrl-btn master-play-btn-large" id="master-play-btn" title="播放或暂停" aria-label="播放或暂停"><span
                                    class="play-icon-layer"><svg class="app-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 4 12 8-12 8Z"/></svg></span><span class="pause-icon-layer"><svg class="app-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></span></button>
                            <button class="ctrl-btn" id="play-next-btn" title="下一首" aria-label="下一首"><svg class="app-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
                        </div>
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <span id="curr-time" class="time-label">00:00</span>
                            <input type="range" id="seek-slider" aria-label="播放进度" class="pure-slider" min="0" max="100" value="0">
                            <span id="total-time" class="time-label">00:00</span>
                        </div>
                    </div>
                </div>
                <!-- 右侧：播放列表区域 -->
                <div class="playlist-container">

                    <div class="playlist-window">
                        <div class="playlist-slider" id="slider">
                            <!-- Level 0: 分类 -->
                            <div class="level-view">
                                <div class="view-header">
                                    <div class="header-left-group"><span><img src="ui/music-class.svg"
                                                style="width: 1.25em; vertical-align: middle; margin-right: 4px;">
                                            音乐分类</span></div>
                                    <span class="header-playing-info"></span>
                                    <!-- Add button removed -->
                                </div>
                                <div class="view-content" id="list-level-0"></div>
                            </div>
                            <!-- Level 1: 合集 -->
                            <div class="level-view">
                                <div class="view-header">
                                    <div class="header-left-group">
                                        <button type="button" class="nav-back" id="nav-back-L1-text">返回</button>
                                        <button type="button" class="music-home-button" id="nav-home-L1" title="返回分类" aria-label="返回分类"><img src="ui/music-home.svg" class="home-icon-svg" alt=""></button>
                                        <span id="title-level-1" class="title-level"></span>
                                    </div>
                                    <span class="header-playing-info"></span>
                                    <!-- Add button removed -->
                                </div>
                                <div class="view-content" id="list-level-1"></div>
                            </div>
                            <!-- Level 2: 视频/专辑 -->
                            <div class="level-view">
                                <div class="view-header">
                                    <div class="header-left-group">
                                        <button type="button" class="nav-back" id="nav-back-L2-text">返回</button>
                                        <button type="button" class="music-home-button" id="nav-home-L2" title="返回分类" aria-label="返回分类"><img src="ui/music-home.svg" class="home-icon-svg" alt=""></button>
                                        <span id="title-level-2" class="title-level"></span>
                                    </div>
                                    <span class="header-playing-info"></span>
                                    <!-- Add button removed -->
                                </div>
                                <div class="view-content" id="list-level-2"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ES6 模块入口 (整合所有 Music 模块) -->
    <script type="module" src="custom/music/main.module.js"></script>
    <script>
        // 消息监听 (来自 iframe 或其他窗口)
        window.addEventListener('message', function (event) {
            if (event.data === 'toggle') MAERS.Music.Player && MAERS.Music.Player.togglePlay();
            else if (event.data === 'next') MAERS.Music.Control && MAERS.Music.Control.playNext();
            else if (event.data === 'prev') MAERS.Music.Control && MAERS.Music.Control.playPrev();
        });
    </script>
</body>

</html>
