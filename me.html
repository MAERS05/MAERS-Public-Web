<!DOCTYPE html>
<html lang="zh-CN" class="fixed-layout-page">

<head>
    <script src="shared/flash-guard.js"></script>
    <script src="custom/config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我 · 我的空间</title>

    <!--  Resource Preloading -->
    <link rel="preload" href="static-style/theme.css" as="style">
    <link rel="preload" href="static-style/components.css" as="style">

    <link rel="stylesheet" href="static-style/theme.css">
    <link rel="stylesheet" href="static-style/components.css">
    <link rel="stylesheet" href="static-style/style.css">
    <script type="module" src="data-manage/data-provider.module.js"></script>
    <!-- Layout handled by module -->
    <style>
        .placeholder-content { width: min(480px, 100%); margin: auto; padding: 40px 0 64px; display: flex; flex-direction: column; align-items: flex-start; color: var(--text-main); }
        .placeholder-content > img { width: 36px; height: 36px; margin-bottom: 20px; filter: invert(1); }
        html.light-mode .placeholder-content > img { filter: none; }
        .placeholder-text { font-size: 24px; font-weight: 600; margin: 0; }
        .contact-form { display: grid; gap: 14px; width: 100%; margin-top: 26px; }
        .form-input, .form-textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-soft); color: var(--text-main); font: inherit; }
        .form-input:focus, .form-textarea:focus { border-color: var(--accent); background: var(--surface); }
        .form-textarea { min-height: 160px; resize: vertical; }
        .submit-btn { min-height: 42px; border: 0; border-radius: 9px; background: var(--accent); color: var(--on-accent); font-weight: 500; }
        .submit-btn:hover { background: var(--accent-strong); }
        .contact-note { margin-top: 12px; font-size: 13px; color: var(--text-sub); }
    </style>
</head>

<body>
    <div class="container">
        <div class="main-card">
            <div class="placeholder-content">
                <img src="ui/email.svg" alt="邮箱">
                <div class="placeholder-text">联系我</div>

                <!-- 
                      [IMPORTANT] 
                     请将 action 中的 "YOUR_FORM_ID" 替换为您在 https://formspree.io/ 注册后获取的 ID。
                     注册非常简单，通常不会被风控拦截。
                -->
                <form id="contact-form" class="contact-form" action="" method="POST">
                    <input type="email" name="email" class="form-input" aria-label="你的邮箱" placeholder="你的邮箱，用于回复" required>
                    <textarea name="message" class="form-textarea" aria-label="留言内容" placeholder="想说些什么？至少填写十个字"
                        minlength="10" required></textarea>
                    <button type="submit" class="submit-btn" id="form-btn" disabled>发送留言</button>
                    <p id="form-status" class="contact-note" style="display: none;"></p>
                </form>


            </div>
        </div>
    </div>
    <script type="module">
        import { renderPageHeader } from './shared/simple-main.module.js';
        renderPageHeader('<img src="ui/index.svg" alt="" class="title-icon" style="height: 1.5em; width: auto; vertical-align: middle; margin-right: 8px; position: relative; top: -0.2em;"> 关于我', "index.html", "返回");

        // [Advanced] AJAX Form Handling
        const form = document.getElementById("contact-form");
        const btn = document.getElementById("form-btn");
        const status = document.getElementById("form-status");

        async function handleSubmit(event) {
            event.preventDefault();
            if (!form.getAttribute('action')) return;
            const data = new FormData(event.target);

            // UI Loading State
            btn.disabled = true;
            btn.innerText = "正在发送…";
            status.style.display = "none";
            status.className = "contact-note"; // reset class

            try {
                const response = await fetch(event.target.action, {
                    method: form.method,
                    body: data,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    // Success
                    status.innerHTML = "留言已发送";
                    status.style.color = "var(--text-main)";
                    status.style.display = "block";
                    btn.innerText = "已发送";
                    form.reset();
                } else {
                    // Error (Domain block, etc.)
                    const errorData = await response.json();
                    status.innerHTML = "发送失败：" + (errorData.error || "留言未能发送");
                    status.style.color = "var(--danger)";
                    status.style.display = "block";
                    btn.innerText = "重新发送";
                    btn.disabled = false;
                }
            } catch (error) {
                // Network Error
                status.innerHTML = "网络暂时不可用，请稍后重试";
                status.style.color = "var(--danger)";
                status.style.display = "block";
                btn.innerText = "重新发送";
                btn.disabled = false;
            }
        }

        btn.disabled = !form.getAttribute('action');
        if (btn.disabled) {
            status.textContent = '联系表单尚未配置。请设置你自己的表单接收地址。';
            status.style.display = 'block';
        }
        form.addEventListener("submit", handleSubmit);
    </script>
</body>

</html>
