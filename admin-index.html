<!doctype html>
<html lang="zh-CN" style="background-color: #0a0a0a; color: #e0e0e0">

<head>
    <!-- 🔥 第一优先级：关键主题CSS，在任何其他内容之前定义 -->
    <script>
        // 1. 恢复缩放状态 (Index Only - Memory)
        try {
            if (localStorage.getItem("globalZoomState") === "true") {
                document.documentElement.classList.add("shrink-view");
            }
        } catch (e) { }
    </script>

    <style id="critical-theme-css">
        /* 🔥 最高优先级：立即强制深色背景 */
        html {
            background-color: #0a0a0a !important;
            color: #e0e0e0 !important;
        }

        /* 浅色主题覆盖 */
        html.light-mode {
            background-color: #ffffff !important;
            color: #1a1a1a !important;
        }

        /* body 继承背景色 */
        body {
            background-color: inherit !important;
            color: inherit !important;
            margin: 0;
            padding: 0;
        }

    </style>

    <!-- 🔥 第三优先级：主题检测脚本 (精简版 - 逻辑已同步至 theme-init.js，但此处保留用于覆盖 index 特有的 mask 逻辑) -->
    <script src="custom/config.js"></script>
    <script src="shared/flash-guard.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="ui/logo.svg" />
    <title>MAERS Public Admin - Index</title>

    <!-- 🚀 Resource Preloading -->
    <link rel="preload" href="static-style/theme.css" as="style" />
    <link rel="preload" href="static-style/components.css" as="style" />
    <link rel="dns-prefetch" href="https://api.bilibili.com" />

    <link rel="stylesheet" href="static-style/theme.css" />
    <link rel="stylesheet" href="static-style/components.css" />
    <link rel="stylesheet" href="static-style/style.css" />
    <script type="module" src="custom/index/admin/index-admin.module.js"></script>
    <link rel="stylesheet" href="custom/index/viewer/index.css" />
    <link rel="stylesheet" href="static-style/toast.css" />
    <!-- 引入管理界面专用样式 (for buttons, hover effects) -->
    <link rel="stylesheet" href="custom/admin-portal/viewer/admin-portal.css" />
    <link rel="stylesheet" href="static-style/admin-modal.css" />
    <link rel="stylesheet" href="static-style/sync-ui.css" />
</head>

<body>
    <a href="admin-portal.html" class="back-btn"
        style="position: fixed; top: 20px; left: 20px; z-index: 1000; text-decoration: none;">
        <span style="font-size: 1.2em; line-height: 1;">←</span> Back
    </a>
    <div class="home-container">
        <div class="brand-area">
            <img src="ui/index.svg" alt="Logo" class="brand-logo" id="brand-logo" />
            <div class="brand-title">
                <span class="maers-interactive" id="brand-maers">MAERS</span>
                <span class="maers-interactive" id="brand-space">SPACE</span>
            </div>
            <div class="brand-subtitle">Personal Knowledge & Creative Hub</div>
        </div>
        <div class="nav-grid">
            <!-- Cards will be loaded dynamically from data/index-cards.json -->
        </div>
        <footer style="
          margin-top: 60px;
          color: var(--text-sub);
          font-size: 0.8rem;
          opacity: 0.6;
        ">
            &copy; 2026 Maers Personal Web. Powered by AI.
        </footer>
    </div>
</body>

</html>
