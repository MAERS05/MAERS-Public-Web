<!doctype html>
<html lang="zh-CN" class="fixed-layout-page">

<head>
    <script src="shared/flash-guard.js"></script>
    <script src="custom/config.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>游戏 · 我的空间</title>

    <!--  Resource Preloading -->
    <link rel="preload" href="static-style/theme.css" as="style" />
    <link rel="preload" href="static-style/components.css" as="style" />

    <link rel="stylesheet" href="static-style/theme.css" />
    <link rel="stylesheet" href="static-style/components.css" />
    <link rel="stylesheet" href="static-style/style.css" />
    <link rel="stylesheet" href="custom/cms/viewer/cms-base.css" />
    <link rel="stylesheet" href="custom/cms/viewer/cms-theme-default.css" />
    <link rel="stylesheet" href="custom/games/viewer/games.css" />
    <link rel="stylesheet" href="custom/games/viewer/games-reset.css" />
</head>

<body>
    <div class="container">
        <div class="main-card content-mode">
            <!-- 头部：标题与工具栏 -->
            <div class="explorer-header">
                <div class="header-left">
                    <a href="index.html" class="back-btn" title="返回" aria-label="返回"><svg class="app-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></a>
                    <!-- Icon will use literature-icon if games-icon doesn't exist, or just text if image fails -->
                    <div class="header-title"><img src="ui/games-icon.svg" onerror="this.src='ui/literature-icon.svg'"
                            alt="游戏" style="height: 1.25em; width: auto; vertical-align: middle;"> 游戏</div>
                </div>
                <div class="header-right">
                    <div class="header-tools-row">
                        <div class="search-box">
                            <input type="search" class="search-input" id="search-input" placeholder="搜索名称" />
                        </div>
                        <button class="tag-toggle-btn" title="筛选标签" aria-label="筛选标签"><svg class="app-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 3h8l10 10-8 8L3 11Z"/><circle cx="7" cy="7" r="1"/></svg></button>
                    </div>
                </div>
            </div>
            <!-- 面包屑 -->
            <div class="breadcrumb-bar" id="breadcrumb"></div>


            <!-- 网格列表 (Played 视图) -->
            <div id="grid-container" class="folder-grid"></div>

            <!-- Playing 视图（占位，后续填充内容） -->
            <div id="playing-container" class="playing-view"></div>

            <!-- 笔记阅读器 (用于查看详细信息) -->
            <div id="reader-container" class="reader-view">
                <div class="markdown-body" id="note-content"></div>
            </div>
        </div>
    </div>

    <div id="immersive-reader" class="immersive-layer">
        <div class="reader-toolbar">
            <div class="reader-meta">
                <span class="reader-title" id="reader-title">未命名</span>
            </div>
            <div class="reader-actions">
                <button class="close-btn" title="关闭" aria-label="关闭"><svg class="app-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
            </div>
        </div>
        <div class="reader-scroll-area">
            <div class="markdown-body paper-sheet" id="reader-content"></div>
        </div>
    </div>

    <div id="drawer-overlay" class="drawer-overlay"></div>
    <div id="tag-drawer" class="tag-drawer">
        <div class="drawer-header" style="flex-direction: column; align-items: flex-start; gap: 15px">
            <div style="
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
          ">
                <h3>标签</h3>
                <button class="btn-close-drawer" title="关闭" aria-label="关闭"><svg class="app-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
            </div>
            <input type="search" id="tag-drawer-search" class="drawer-search-input" placeholder="搜索标签" />
        </div>
        <div class="drawer-body" id="drawer-list"></div>
        <div class="drawer-footer">
            <button class="btn-clear-tags">清空筛选</button>
        </div>
    </div>

    <!-- 数据现在通过 ES6 模块异步加载 (data/games-tree.json) -->
    <!-- Vditor for Editor -->

    <!-- ES6 Main Entry Point -->
    <script type="module" src="custom/games/main.module.js"></script>
</body>

</html>
